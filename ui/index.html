<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiraiya AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">🐸</div>
                <div>
                    <h1>Jiraiya</h1>
                    <span>AI Assistant</span>
                </div>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span>＋</span>
                <span>New chat</span>
            </button>

            <div class="sidebar-section">
                <div class="section-title">Chats</div>
                <div id="chatHistory" class="chat-history"></div>
            </div>

            <div class="sidebar-bottom">
                <div class="status">
                    <span class="status-dot"></span>
                    <span>Jiraiya online</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">

            <!-- Header -->
            <header class="topbar">
                <button class="mobile-menu" id="menuBtn">☰</button>

                <div class="model-info">
                    <strong>Jiraiya</strong>
                    <span>Qwen2.5 Coder 1.5B</span>
                </div>

                <button class="settings-btn" title="Settings">⚙</button>
            </header>

            <!-- Chat -->
            <section class="chat-area" id="chatArea">

                <div class="welcome" id="welcome">
                    <div class="welcome-logo">🐸</div>
                    <h2>Namaste, I'm Jiraiya.</h2>
                    <p>How can I help you today?</p>

                    <div class="suggestions">
                        <button data-prompt="Explain something to me">
                            💡 Explain something
                        </button>

                        <button data-prompt="Help me write some code">
                            💻 Help me code
                        </button>

                        <button data-prompt="Search the web for something">
                            🌐 Search the web
                        </button>

                        <button data-prompt="Calculate something for me">
                            🧮 Calculate
                        </button>
                    </div>
                </div>

            </section>

            <!-- Input -->
            <div class="composer-wrapper">
                <div class="composer">

                    <button class="attach-btn" title="Attach file">
                        ＋
                    </button>

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message Jiraiya..."
                        autocomplete="off"
                    ></textarea>

                    <button class="send-btn" id="sendBtn" title="Send">
                        ➤
                    </button>

                </div>

                <div class="disclaimer">
                    Jiraiya can make mistakes. Check important information.
                </div>
            </div>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
